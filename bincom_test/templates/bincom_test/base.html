<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bincom Election Results{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Delta 2011 Results</a>
            <div>
                <a class="nav-link d-inline text-white" href="{% url 'polling_unit_result' %}">Polling unit</a>
                <a class="nav-link d-inline text-white ms-3" href="{% url 'lga_result' %}">LGA totals</a>
                <a class="nav-link d-inline text-white ms-3" href="{% url 'new_polling_unit_result' %}">New results</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        
        {% endblock %}
    </main>
    
</body>
</html>
